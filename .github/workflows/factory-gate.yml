name: Factory Kernel Gate

# The factory kernel is the only target in this repo that turns a versioned
# PluginSpec document into a runnable processor, so its gate proves three things:
#   1. the kernel and its module library build,
#   2. the factory-level automated tests pass (ctest, `Factory.Unit`),
#   3. every committed example spec actually loads, builds and renders audio
#      through the CLI.
#
# NOTE: the workflow file itself is listed in both `paths` filters. A commit that
# touches only this file must still trigger the gate - omitting it once already
# caused a silent no-run (see ztame-release-gate.yml history).
on:
  pull_request:
    paths:
      - 'factory/**'
      - 'zarlino-website/src/factory/**'
      - 'zarlino-website/test/factory/**'
      - 'zarlino-website/src/pages/factory/**'
      - 'zarlino-website/src/components/factory/**'
      - 'zarlino-website/wrangler.toml'
      - 'zarlino-website/package.json'
      - 'zarlino-website/package-lock.json'
      - 'zarlino-website/tsconfig.factory.json'
      - 'shared/dsp/**'
      - 'shared/utils/**'
      - 'plugins/ZScorch/Source/Saturator.h'
      - 'plugins/ZScorch/Source/Saturator.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/factory-gate.yml'
  push:
    branches: [main]
    paths:
      - 'factory/**'
      - 'zarlino-website/src/factory/**'
      - 'zarlino-website/test/factory/**'
      - 'zarlino-website/src/pages/factory/**'
      - 'zarlino-website/src/components/factory/**'
      - 'zarlino-website/wrangler.toml'
      - 'zarlino-website/package.json'
      - 'zarlino-website/package-lock.json'
      - 'zarlino-website/tsconfig.factory.json'
      - 'shared/dsp/**'
      - 'shared/utils/**'
      - 'plugins/ZScorch/Source/Saturator.h'
      - 'plugins/ZScorch/Source/Saturator.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/factory-gate.yml'
  workflow_dispatch:

jobs:
  windows-factory-tests:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build factory kernel, test runner and CLI
        run: cmake --build build --config Release --target Factory_Tests ZarlinoFactory_Check --parallel

      # Scope the selection to `Factory.` and refuse to report a green gate when
      # nothing was selected. Every plugin labels its own suite `release-gate`,
      # and those executables are NOT built by this job, so the bare label would
      # make ctest report "Not Run" for them and exit 1.
      - name: Run factory tests
        shell: pwsh
        run: |
          $listed = ctest --test-dir build -C Release -N -R '^Factory\.'
          $listed | Write-Host
          if (-not ($listed | Select-String -SimpleMatch 'Factory.Unit')) {
            Write-Error 'Factory.Unit is not registered - refusing to report a green gate with nothing selected.'
            exit 1
          }
          ctest --test-dir build -C Release -R '^Factory\.' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The tests load the committed specs from disk; this step proves the CLI
      # does the same end to end and produces finite, non-silent audio.
      - name: Validate and render every committed example spec
        shell: pwsh
        run: |
          $cli = 'build/factory/ZarlinoFactory_Check_artefacts/Release/ZarlinoFactory_Check.exe'
          if (-not (Test-Path $cli)) { Write-Error "factory CLI not found at $cli"; exit 1 }

          & $cli --catalog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $specs = Get-ChildItem factory/specs/*.zfactory.json
          if ($specs.Count -lt 3) { Write-Error "expected at least 3 example specs, found $($specs.Count)"; exit 1 }

          foreach ($spec in $specs) {
            Write-Host "=== $($spec.Name) ==="
            & $cli $spec.FullName --render --block 257
            if ($LASTEXITCODE -ne 0) { Write-Error "example spec failed: $($spec.Name)"; exit $LASTEXITCODE }
          }

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-gate-ctest-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      #------------------------------------------------------------------------
      # CATALOGUE PARITY (launch gate)
      #
      # The customer application validates a design and shows the build plan
      # BEFORE a build is paid for. Its TypeScript catalogue must therefore be
      # byte-for-byte the kernel's own manifest set. This step regenerates the
      # catalogue from the just-built kernel and refuses a mismatch: a stale
      # catalogue would let a customer pay for a build that cannot succeed, or
      # refuse a design that would have worked.
      #------------------------------------------------------------------------
      - name: Catalogue parity with the kernel
        shell: pwsh
        run: |
          $cli = 'build/factory/ZarlinoFactory_Check_artefacts/Release/ZarlinoFactory_Check.exe'
          & $cli --catalog-json | Out-File -FilePath catalog-generated.json -Encoding utf8

          $expected = Get-Content factory/catalog/modules.json -Raw
          $actual = Get-Content catalog-generated.json -Raw

          if ($expected -ne $actual) {
            Write-Host '--- committed catalogue ---'
            Write-Host $expected
            Write-Host '--- generated from the kernel ---'
            Write-Host $actual
            Write-Error 'factory/catalog/modules.json is stale: regenerate it from ZarlinoFactory_Check --catalog-json and update zarlino-website/src/factory/catalog.ts'
            exit 1
          }
          Write-Host 'catalogue matches the compiled kernel'

  #==========================================================================
  # Customer application gate (Node side of the same factory).
  #
  # Runs the TypeScript engine (PluginSpec validation, plan/UI compilation,
  # entitlement rules, the store, the HTTP surface, the launch simulation and
  # the security cases) plus the production Astro build. This is the gate that
  # proves the thing a customer actually touches.
  #==========================================================================
  customer-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: zarlino-website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zarlino-website/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck the factory application (strict)
        run: npx tsc --noEmit -p tsconfig.factory.json

      - name: Factory tests (unit, isolation, launch simulation, security)
        run: npx vitest run test/factory --reporter=verbose

      - name: Production site build
        run: npm run build

      - name: Worker bundle check (bindings resolve, DO classes register)
        run: npx wrangler deploy --dry-run --outdir .wrangler/ci-dist
