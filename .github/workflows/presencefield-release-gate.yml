name: PresenceField Release Gate

on:
  pull_request:
    paths:
      - 'plugins/PresenceField/**'
      - 'shared/**'
      - '.github/workflows/presencefield-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/PresenceField/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  windows-build-package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build PresenceField (VST3 + Standalone)
        run: cmake --build build --config Release --target PresenceField --parallel

      - name: Package VST3 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/vst3
          Copy-Item -Recurse -Path "build/plugins/PresenceField/PresenceField_artefacts/Release/VST3/PresenceField.vst3/*" -Destination artifacts/vst3/ -Force
          Compress-Archive -Path artifacts/vst3/* -DestinationPath "artifacts/PresenceField-v0.1.0-Windows-VST3.zip"

      - name: Package Standalone artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/standalone
          Copy-Item -Path "build/plugins/PresenceField/PresenceField_artefacts/Release/Standalone/PresenceField.exe" -Destination artifacts/standalone/ -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path artifacts/standalone/* -DestinationPath "artifacts/PresenceField-v0.1.0-Windows-Standalone.zip"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          cd plugins/PresenceField/installer
          makensis /DVERSION=0.1.0 PresenceField.nsi
          Move-Item -Force "PresenceField-v0.1.0-Windows-Installer.exe" "../../../artifacts/"

      - name: Upload VST3 zip
        uses: actions/upload-artifact@v4
        with:
          name: PresenceField-v0.1.0-Windows-VST3
          path: artifacts/PresenceField-v0.1.0-Windows-VST3.zip
          if-no-files-found: error

      - name: Upload Standalone zip
        uses: actions/upload-artifact@v4
        with:
          name: PresenceField-v0.1.0-Windows-Standalone
          path: artifacts/PresenceField-v0.1.0-Windows-Standalone.zip
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: PresenceField-v0.1.0-Windows-Installer
          path: artifacts/PresenceField-v0.1.0-Windows-Installer.exe
          if-no-files-found: warn
