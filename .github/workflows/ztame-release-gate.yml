name: ZTame Release Gate

on:
  pull_request:
    paths:
      - 'plugins/ZTame/**'
      - 'shared/**'
      - 'cmake/ZarlinoTest.cmake'
      - 'tools/release/**'
      - '.github/workflows/ztame-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/ZTame/**'
      - 'shared/**'
      - 'cmake/ZarlinoTest.cmake'
      - 'tools/release/**'
      - '.github/workflows/ztame-release-gate.yml'
  workflow_dispatch:

jobs:
  windows-build-package:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # Production RSA public key for license verification (embedded at configure time).
      # Set this secret to ship a production build; unset = placeholder (trial-only).
      ZARLINO_LICENSE_PUBLIC_KEY: ${{ secrets.ZARLINO_LICENSE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      # The bare `ZTame` target is a shared-code-only no-op (the plugin folder
      # defines a static code library under that name) — `ZTame_All` is what
      # actually produces the VST3 bundle and the standalone exe that the
      # packaging steps below copy. Same pitfall documented in
      # tools/build-release-local.ps1; until the ctest selection was fixed this
      # step was never reached, so the missing formats stayed hidden.
      #
      # ZTame_UiShot is a console app that renders the REAL editor offscreen
      # (no window manager) — it produces the canonical release screenshot.
      - name: Build ZTame (VST3 + Standalone), test runner, UiShot and RealRender
        run: cmake --build build --config Release --target ZTame_All ZTame_Tests ZTame_UiShot ZTame_RealRender --parallel

      # Scope the label gate to THIS plugin's suite, and refuse to report a
      # green gate when nothing was selected.
      #
      # Why the scope is required: every plugin labels its own suite
      # `release-gate` (plugins/*/CMakeLists.txt), so with -DBUILD_TESTING=ON the
      # configure step registers ZTame.Unit, ZVocal.Unit and ZScorch.Unit. This
      # job only builds the ZTame targets, so selecting the bare label made
      # ctest try to run the two unbuilt executables, report them "Not Run" and
      # exit 1 — which is why every run of this workflow has failed since it was
      # added, for a reason that has nothing to do with ZTame. The ZVocal and
      # ZScorch suites are not skipped silently: they are validated by their own
      # gates (their tests are built and run when those plugins are built).
      # Same per-plugin scoping as tools/build-release-local.ps1 and the VM
      # build-host verify step.
      - name: Run automated release-gate tests
        shell: pwsh
        run: |
          $listed = ctest --test-dir build -C Release -N -L release-gate -R '^ZTame\.'
          if ($LASTEXITCODE -ne 0) { throw "ctest could not enumerate the release-gate tests" }
          $listed | Write-Host
          if (($listed | Out-String) -notmatch 'Total Tests:\s*[1-9]') {
            throw "No ZTame release-gate tests were registered — refusing a green gate with nothing tested."
          }
          ctest --test-dir build -C Release --output-on-failure -L release-gate -R '^ZTame\.'
          if ($LASTEXITCODE -ne 0) { throw "ZTame release-gate tests failed" }

      # --- Sign plugin binaries IN-PLACE before packaging (inert until enabled) ---
      # Master switch: ZARLINO_SIGNING_ENABLED must be 'true' at repo/org level.
      # Signs the VST3 module DLL(s) and the standalone exe so the installer embeds
      # signed binaries. File-digest SHA-256 with an RFC3161 trust timestamp (the
      # action defaults to a Microsoft timestamp service).
      - name: Sign VST3 + Standalone binaries (Azure Artifact Signing)
        if: ${{ vars.ZARLINO_SIGNING_ENABLED == 'true' }}
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: |
            build/plugins/ZTame/ZTame_artefacts/Release/VST3/ZTame.vst3/Contents/x86_64-win/ZTame.vst3
            build/plugins/ZTame/ZTame_artefacts/Release/Standalone/ZTame.exe
          file-digest: SHA256

      # --- Package raw format artifacts ---
      - name: Package VST3 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/vst3
          Copy-Item -Recurse -Path "build/plugins/ZTame/ZTame_artefacts/Release/VST3/ZTame.vst3/*" -Destination artifacts/vst3/ -Force
          Compress-Archive -Path artifacts/vst3/* -DestinationPath "artifacts/ZTame-v1.2.0-Windows-VST3.zip"

      - name: Package Standalone artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/standalone
          Copy-Item -Path "build/plugins/ZTame/ZTame_artefacts/Release/Standalone/ZTame.exe" -Destination artifacts/standalone/ -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "plugins/ZTame/README.md" -Destination artifacts/standalone/ -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path artifacts/standalone/* -DestinationPath "artifacts/ZTame-v1.2.0-Windows-Standalone.zip"

      # --- NSIS installer ---
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          cd plugins/ZTame/installer
          makensis /DVERSION=1.2.0 ZTame.nsi
          Move-Item -Force "ZTame-v1.2.0-Windows-Installer.exe" "../../../artifacts/"

      # --- Sign the NSIS installer stub AFTER NSIS compiles (inert until enabled) ---
      # The installer stub must itself be signed, not only the inner payload.
      - name: Sign NSIS installer (Azure Artifact Signing)
        if: ${{ vars.ZARLINO_SIGNING_ENABLED == 'true' }}
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: |
            artifacts/ZTame-v1.2.0-Windows-Installer.exe
          file-digest: SHA256

      # --- Verify signature (inert until enabled) ---
      - name: Verify Authenticode signatures
        if: ${{ vars.ZARLINO_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          Get-AuthenticodeSignature "build/plugins/ZTame/ZTame_artefacts/Release/VST3/ZTame.vst3/Contents/x86_64-win/ZTame.vst3" |
            ForEach-Object { if ($_.Status -ne 'Valid') { throw "VST3 signature invalid: $($_.Status)" } }
          Get-AuthenticodeSignature "build/plugins/ZTame/ZTame_artefacts/Release/Standalone/ZTame.exe" |
            ForEach-Object { if ($_.Status -ne 'Valid') { throw "Standalone signature invalid: $($_.Status)" } }
          Get-AuthenticodeSignature "artifacts/ZTame-v1.2.0-Windows-Installer.exe" |
            ForEach-Object { if ($_.Status -ne 'Valid') { throw "Installer signature invalid: $($_.Status)" } }

      # --- Canonical screenshot: render the REAL release editor offscreen -----
      # (§9) A screenshot is evidence only when it comes from the exact release
      # candidate being verified. Marketing art / mockups are NOT canonical.
      - name: Render canonical screenshot (headless UiShot)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build/plugins/ZTame/ZTame_UiShot_artefacts" -Recurse -Filter "ZTame_UiShot.exe" | Select-Object -First 1
          if (-not $exe) { throw "ZTame_UiShot.exe not found - screenshot pipeline cannot run" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & $exe.FullName "artifacts/ztame-ui.png"
          if ($LASTEXITCODE -ne 0) { throw "ZTame_UiShot failed with exit code $LASTEXITCODE" }

      - name: Validate canonical screenshot (not blank / not mostly black)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/release/validate-screenshot.ps1 -Path artifacts/ztame-ui.png -MinWidth 640 -MinHeight 480

      # --- Canonical audio evidence (§10-§14) --------------------------------
      # The EXACT release candidate renders the committed reference set
      # (plugins/ZTame/references/) dry + wet. Masters stay untouched; the
      # comparison pair is levelled to the quieter side (min-target) so the A/B
      # can never be won by loudness. Measurements are machine-validated.
      - name: Generate audio render manifest
        shell: pwsh
        run: |
          node tools/release/build-render-manifest.mjs `
            --references plugins/ZTame/references/references.json `
            --outDir artifacts/audio --out artifacts/audio-manifest.json `
            --version 1.2.0 --gitHead ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "audio render manifest generation failed" }

      - name: Render canonical audio (dry/wet through the release plugin)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build/plugins/ZTame/ZTame_RealRender_artefacts" -Recurse -Filter "ZTame_RealRender.exe" | Select-Object -First 1
          if (-not $exe) { throw "ZTame_RealRender.exe not found - audio pipeline cannot run" }
          & $exe.FullName "artifacts/audio-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "ZTame_RealRender failed with exit code $LASTEXITCODE" }

      - name: Validate audio evidence (loudness-matched, non-silent, complete)
        shell: pwsh
        run: |
          node tools/release/validate-audio.mjs `
            --metrics artifacts/audio/render-metrics.json `
            --dir artifacts/audio `
            --references plugins/ZTame/references/references.json `
            --out artifacts/audio-validation.json
          if ($LASTEXITCODE -ne 0) { throw "audio validation failed - release NOT verified" }

      - name: Install web audio encoder (pinned)
        shell: pwsh
        run: npm install --no-save --prefix artifacts/webencoder --no-audit --no-fund @breezystack/lamejs@1.2.7

      - name: Encode web previews (MP3 from the comparison pair)
        shell: pwsh
        working-directory: artifacts/webencoder
        run: |
          node "$env:GITHUB_WORKSPACE/tools/release/encode-web-audio.mjs" `
            --metrics "$env:GITHUB_WORKSPACE/artifacts/audio/render-metrics.json" `
            --dir "$env:GITHUB_WORKSPACE/artifacts/audio" `
            --outDir "$env:GITHUB_WORKSPACE/artifacts/audio/web"
          if ($LASTEXITCODE -ne 0) { throw "web audio encoding failed" }

      - name: Build audio evidence bundle (referenced + hashed)
        shell: pwsh
        run: |
          node tools/release/build-audio-evidence.mjs `
            --metrics artifacts/audio/render-metrics.json `
            --references plugins/ZTame/references/references.json `
            --dir artifacts/audio --webDir artifacts/audio/web `
            --out artifacts/audio-evidence.json
          if ($LASTEXITCODE -ne 0) { throw "audio evidence build failed" }

      # --- Release manifest: the atomic release unit (§7/§8/§17) -------------
      # Binds binaries + screenshot + canonical audio + metadata + commit to the
      # SAME release candidate with sha256 hashes. finalize recomputes every
      # hash from disk and only then flips the status to VERIFIED - fail closed.
      - name: Generate release manifest (hashes)
        shell: pwsh
        run: |
          node tools/release/release-manifest.mjs generate `
            --product ZTame --version 1.2.0 --commit ${{ github.sha }} `
            --out artifacts/release-manifest.json `
            --installer artifacts/ZTame-v1.2.0-Windows-Installer.exe `
            --vst3 artifacts/ZTame-v1.2.0-Windows-VST3.zip `
            --standalone artifacts/ZTame-v1.2.0-Windows-Standalone.zip `
            --screenshot artifacts/ztame-ui.png `
            --audio artifacts/audio-evidence.json
          if ($LASTEXITCODE -ne 0) { throw "manifest generation failed" }

      - name: Validate + finalize release manifest (integrity re-check)
        shell: pwsh
        run: |
          node tools/release/release-manifest.mjs validate --manifest artifacts/release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw "manifest validation failed" }
          node tools/release/release-manifest.mjs finalize --manifest artifacts/release-manifest.json --dir artifacts --audio-dir artifacts/audio --web-dir artifacts/audio/web
          if ($LASTEXITCODE -ne 0) { throw "manifest finalize (integrity) failed - release NOT verified" }

      # --- Upload all artifacts ---
      - name: Upload VST3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ZTame-v1.2.0-Windows-VST3
          path: artifacts/ZTame-v1.2.0-Windows-VST3.zip
          if-no-files-found: error

      - name: Upload Standalone zip
        uses: actions/upload-artifact@v4
        with:
          name: ZTame-v1.2.0-Windows-Standalone
          path: artifacts/ZTame-v1.2.0-Windows-Standalone.zip
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZTame-v1.2.0-Windows-Installer
          path: artifacts/ZTame-v1.2.0-Windows-Installer.exe
          if-no-files-found: error

      # The manifest is the authoritative relationship between binaries,
      # screenshot, metadata and commit. Only a VERIFIED manifest may be
      # consumed by the website. Fails the job if absent.
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: ZTame-v1.2.0-release-manifest
          path: artifacts/release-manifest.json
          if-no-files-found: error

      # The canonical screenshot itself must remain retrievable, not only hashed:
      # the manifest binds it by sha256, and the website consumes it from a
      # verified release (storage/publication decision tracked separately).
      - name: Upload canonical screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ZTame-v1.2.0-canonical-screenshot
          path: artifacts/ztame-ui.png
          if-no-files-found: error

      # Canonical audio evidence: masters (dry + wet raw), the level-matched
      # comparison pair, the web previews, the machine measurements and the
      # validation record. All are sha256-bound inside the release manifest.
      - name: Upload canonical audio evidence
        uses: actions/upload-artifact@v4
        with:
          name: ZTame-v1.2.0-canonical-audio
          path: |
            artifacts/audio/MANIFEST.md
            artifacts/audio/render-metrics.json
            artifacts/audio/*.wav
            artifacts/audio/web/*.mp3
            artifacts/audio/web/web-audio.json
            artifacts/audio-validation.json
            artifacts/audio-evidence.json
          if-no-files-found: error
